name: Township Forecast Processing

permissions:
  contents: write

on:

  # Cloudflare Worker trigger 用
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

    # 1️⃣ checkout repo
    - name: Checkout
      uses: actions/checkout@v4

    # 2️⃣ install python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"


    # 3️⃣ install system libs（關鍵）
    - name: Install system dependencies
      run: |

        sudo apt-get update

        sudo apt-get install -y \
          libcairo2 \
          libcairo2-dev \
          libjpeg-dev \
          libgif-dev \
          librsvg2-dev


    # 4️⃣ install python libs
    - name: Install python packages
      run: |

        python -m pip install --upgrade pip

        pip install \
          matplotlib \
          numpy \
          pillow \
          cairosvg \
          requests


    # 5️⃣ run your script
    - name: Run forecast
      run:

        python WeatherReport_auto.py



    # 6️⃣ commit images
    - name: Commit images

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      run: |

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add outputs/
        git commit -m "Update township forecast [skip ci]" || echo "No changes"
        git push
